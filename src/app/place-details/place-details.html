<section class="container py-5" *ngIf="selectedplace">

  <h2 class="text-center fw-bold mb-4">Place Information</h2>

  <div class="row shadow p-4 rounded bg-light">

    <!-- Image -->
    <div class="col-md-5">
      <img 
        [src]="selectedplace.images[0]" 
        class="img-fluid rounded"
      >
    </div>

    <!-- Info -->
    <div class="col-md-7">

      <h3 class="fw-bold">{{selectedplace.name}}</h3>
      <p class="text-muted">{{selectedplace.location}}</p>

      <p>{{selectedplace.description}}</p>
      
  <b><h2 class="mt-4">Location Map</h2></b>

<iframe
  [src]="selectedplace.mapLink | safeUrl"
  width="100%"
  height="300"
  style="border:0;"
  allowfullscreen=""
  loading="lazy">
</iframe>

      <p><strong>Package Price:</strong> ₹ {{selectedplace.price}}</p>

<p><strong>Hotel Price per Night:</strong> ₹ {{selectedplace.hotelPrice}}</p>
  
<div class="d-flex justify-content-start gap-3 mt-3">

<button class="btn btn-success"
(click)="goToHotelBooking()">
Book Hotel
</button>

</div>
</div>
</div>
