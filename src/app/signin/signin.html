<div class="auth-bg">
  <div class="auth-box">

    <h2>Sign In</h2>

    <form (ngSubmit)="login()">

      <input
        type="text"
        placeholder="Username"
        [(ngModel)]="username"
        name="username"
      >

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
      >

      <button type="submit">Login</button>

    </form>

    <p>
      Don't have an account?
      <a [routerLink]="['/signup']" class="signup-link">Sign Up</a>
    </p>

  </div>
</div>
