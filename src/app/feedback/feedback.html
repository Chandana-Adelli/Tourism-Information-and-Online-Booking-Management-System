<section class="feedback-section">

  <div class="feedback-container">

    <h2 class="title">We Value Your Feedback</h2>
    <p class="subtitle">Please let us know your thoughts to help us improve.</p>

    <form #feedbackForm="ngForm" (ngSubmit)="submitFeedback(feedbackForm)">

      <!-- NAME -->
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" name="name" ngModel required placeholder="Enter Your Name">
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Your Email</label>
        <input type="email" name="email" ngModel required placeholder="Enter Your Email">
      </div>

      <!-- RATING -->
      <div class="form-group">
        <label>Rate Your Experience</label>
        <select name="rating" ngModel required>
          <option value="">Choose...</option>
          <option>Excellent</option>
          <option>Very Good</option>
          <option>Good</option>
          <option>Average</option>
          <option>Poor</option>
        </select>
      </div>

      <!-- FEEDBACK -->
      <div class="form-group">
        <label>Your Feedback</label>
        <textarea name="message" ngModel rows="4" required placeholder="Write your feedback"></textarea>
      </div>

      <button type="submit" class="submit-btn">
        Submit Feedback
      </button>

    </form>

  </div>


  <!-- MODAL POPUP -->
  <div class="modal-overlay" *ngIf="showPopup">

    <div class="modal-box">

      <div class="check-icon">✔</div>

      <h2>Thank You!</h2>

      <p> We appreciate you sending us your feedback. Thanks!</p>

      <button class="ok-btn" (click)="closePopup()">
        OK
      </button>

    </div>

  </div>

</section>
